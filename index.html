<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zafellc.com - Guide Reader</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: monospace, sans-serif;
      padding: 2rem;
    }
    .file-input-wrapper {
      margin-bottom: 1.5rem;
    }
    input[type="file"] {
      background: #161b22;
      border: 1px solid #30363d;
      color: #8b949e;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    #content-display {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 1.5rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 200px;
    }
  </style>
</head>
<body>

  <h2>zafellc.com // Load Walkthrough File</h2>

  <div class="file-input-wrapper">
    <input type="file" id="fileInput" accept=".txt,.html,.md,.json">
  </div>

  <div id="content-display">Select a guide file above to view contents...</div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const contentDisplay = document.getElementById('content-display');

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files[0];
      
      if (!file) return;

      const reader = new FileReader();

      reader.onload = (e) => {
        // Displays the text contents directly on the page
        contentDisplay.textContent = e.target.result;
      };

      reader.onerror = () => {
        contentDisplay.textContent = "Error reading file!";
      };

      // Read file as plain text
      reader.readAsText(file);
    });
  </script>

</body>
</html>
